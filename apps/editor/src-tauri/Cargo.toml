[package]
name = "nestst_editor"
version = "0.1.0"
description = "NestST story-game editor"
authors = ["NestST"]
license = "MIT"
repository = ""
edition = "2024"
rust-version = "1.90"

[lib]
name = "nestst_editor"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.12.4", features = [] }
tauri-plugin-dialog = "2"

[dev-dependencies]
tempfile = "3"
