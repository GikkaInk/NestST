name: Bug
description: Something doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected and what you got
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: System
      description: Linux distro, GPU, NestST version
